name: Build Windows installer

on:
  push:
    branches:
      - main
      - feature/v1.5-edge-model
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name EPLValueBetting `
            --add-data "VERSION;." `
            --collect-all tkcalendar `
            --collect-all keyring `
            --collect-all tzdata `
            --hidden-import keyring.backends.Windows `
            app/launcher_v15.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\installer.iss
          Copy-Item dist\EPLValueBetting.exe "release\EPL-Value-Betting-v$env:APP_VERSION-Portable.exe"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: EPL-Value-Betting-v${{ steps.version.outputs.version }}-Windows-Setup
          path: release/*Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: EPL-Value-Betting-v${{ steps.version.outputs.version }}-Portable
          path: release/*Portable.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish or refresh GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag release\*.exe --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag release\*.exe `
              --repo $env:GITHUB_REPOSITORY `
              --title "EPL Value Betting v$env:APP_VERSION" `
              --generate-notes
          }
